[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-memory"
version = "0.4.0"
description = "A local evidence-backed memory store for long-running agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gravity-memory = "gravity_memory.__main__:main"
recall-ledger = "gravity_memory.__main__:main"

[tool.setuptools]
packages = ["gravity_memory","recall_ledger"]

[tool.setuptools.package-data]
gravity_memory = ["catalog.json","web/*.html","web/*.css","web/*.js","web/*.png","licenses/*.txt"]

[project.optional-dependencies]
connectors = ["pypdf>=5,<8"]
semantic = ["numpy", "onnxruntime", "tokenizers"]
