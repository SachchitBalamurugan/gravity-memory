[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-ledger"
version = "0.1.0"
description = "A local evidence-backed memory store for long-running agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recall-ledger = "recall_ledger.__main__:main"

[tool.setuptools]
packages = ["recall_ledger"]
