<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <title>Gravity Memory</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/studio.css">
  <link rel="stylesheet" href="/console.css">
  <script src="/workspace.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/studio.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to workspace</a>
<aside id="side">
  <div class="wordmark"><img src="/favicon.ico" width="29" height="29" alt=""><strong>Gravity <span>Memory</span></strong></div>
  <button class="global-search" id="quick-search" aria-label="Search workspace"><span aria-hidden="true">⌕</span><span>Jump to…</span><kbd>Ctrl K</kbd></button>
  <nav id="navigation" aria-label="Workspace navigation"></nav>
  <div class="sidefoot"><span class="account-mark" id="account-mark" aria-hidden="true">G</span><div id="account-info">Local workspace<small>On this device</small></div>
    <details class="account-menu" id="account-menu" hidden><summary aria-label="Account settings" title="Account settings">•••</summary><div><button id="account-password">Change password</button><button id="logout">Sign out</button></div></details></div>
</aside>
<button id="menu-shade" aria-label="Close navigation" tabindex="-1" hidden></button>
<div class="shell">
  <header>
    <button id="mobile-menu" class="icon-only" aria-label="Toggle navigation" aria-controls="side" aria-expanded="false">☰</button>
    <div class="crumb"><label class="space-select"><span class="scope-dot" aria-hidden="true"></span><select id="workspace" aria-label="Workspace"><option value="personal">My workspace</option><option value="sample">Sample workspace</option></select></label><b>/</b><strong id="crumb">Overview</strong></div>
    <div class="tools"><span class="engine-status"><i aria-hidden="true"></i><span id="engine-status">Local engine</span></span><button class="secondary top-setup" data-page="setup">Agent setup <span aria-hidden="true">↗</span></button></div>
  </header>
  <main id="main" tabindex="-1">
    <div class="pagehead"><div><h1 id="title">Overview</h1><p id="subtitle"></p></div>
      <div class="pageactions"><button class="secondary" data-page="import" id="import-shortcut">Import data</button><button class="primary" id="add">＋ Add source</button></div>
    </div>
    <div id="content" aria-busy="true"></div>
  </main>
</div>
<dialog id="detail" aria-labelledby="dialog-title">
  <div class="dialoghead"><h2 id="dialog-title"></h2><button class="icon-only" id="close" aria-label="Close dialog">×</button></div>
  <div id="dialog-content"></div>
</dialog>
<dialog id="palette" aria-label="Jump to a console page"><form method="dialog"><label for="palette-input">Jump to a page</label><input id="palette-input" type="search" autocomplete="off" placeholder="Search pages or press Enter to find memories…"><div id="palette-items"></div><button class="minor">Close</button></form></dialog>
<div id="message" role="status" aria-live="polite"></div>
</body>
</html>
