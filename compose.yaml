name: gravity-memory
services:
  memory:
    build: .
    restart: unless-stopped
    environment:
      GRAVITY_PUBLIC_ORIGIN: ${GRAVITY_PUBLIC_ORIGIN:-https://${GRAVITY_HOST:-localhost}}
      GRAVITY_OWNER: ${GRAVITY_OWNER:-owner}
      GRAVITY_OWNER_PASSWORD_FILE: /run/gravity/owner-password
      GRAVITY_CONNECTOR_SECRETS: /run/gravity/connectors.json
    volumes:
      - memory-data:/data
      - ${GRAVITY_SECRETS_DIR:-./secrets}:/run/gravity:ro
  gateway:
    image: caddy:2-alpine
    depends_on: [memory]
    restart: unless-stopped
    environment:
      GRAVITY_HOST: ${GRAVITY_HOST:-localhost}
    ports:
      - "${GRAVITY_HTTP_PORT:-80}:80"
      - "${GRAVITY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
volumes:
  memory-data:
  certificates:
  caddy-config:
